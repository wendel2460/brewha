    <!-- Firebase Connection for POS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsap0Yqqlr5ghuhXJuCbItWCQRNXKJMP8",
            authDomain: "brewha-cafe.firebaseapp.com",
            projectId: "brewha-cafe",
            storageBucket: "brewha-cafe.firebasestorage.app",
            messagingSenderId: "831922440831",
            appId: "1:831922440831:web:03c44a4598d00c6c0c4d4a",
            measurementId: "G-83SR0EB5EE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const firestoreAppId = 'brewha-cafe';

        let user = null;
        
        const initAuth = async () => {
            try { 
                await signInAnonymously(auth); 
            } catch(e) { 
                console.error("Firebase Auth Error", e); 
                showToast("Error connecting to cloud database.", "warning");
            }
        };
        
        initAuth();
        
        onAuthStateChanged(auth, (u) => { 
            user = u; 
            const statusDot = document.getElementById('connection-status');
            const statusText = document.getElementById('connection-text');
            
            if (user) {
                if (statusDot) {
                    statusDot.className = "w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                    statusText.textContent = "Cloud Synced";
                }

                // Listen to Admin availability settings
                const availRef = doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'settings', 'availability');
                onSnapshot(availRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.unavailableIds = docSnap.data().ids || [];
                    } else {
                        window.unavailableIds = [];
                    }
                    if (window.renderProducts) window.renderProducts();
                });

            } else {
                if (statusDot) {
                    statusDot.className = "w-2 h-2 bg-red-500 rounded-full";
                    statusText.textContent = "Disconnected";
                }
            }
        });

        window.submitPosOrderToFirebase = async function(orderTotal, ticketItems) {
            if (!user) {
                showToast("Cannot save: Not connected to database.", "warning");
                return false;
            }

            const orderNumber = 'POS-' + Math.floor(Math.random() * 90000 + 10000);
            
            const formattedItems = ticketItems.map(item => {
                let name = `${item.quantity}x ${item.name}`;
                if (item.addons && item.addons.length > 0) {
                    name += ` (+ ${item.addons.map(a => a.name).join(', ')})`;
                }
                return name;
            });

            const newOrder = {
                source: 'POS',
                customer: 'Walk-in',
                items: formattedItems,
                total: orderTotal,
                status: 'Preparing',
                time: 'Just now',
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'orders', orderNumber), newOrder);
                return true;
            } catch(e) { 
                console.error("Error saving POS order:", e); 
                showToast("Error saving order to cloud.", "warning");
                return false;
            }
        };
        
        window.showToast = function(msg, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colorClass = type === "success" ? "bg-gray-800" : "bg-red-500";
            const iconClass = type === "success" ? "ph-check-circle text-green-400" : "ph-warning-circle text-white";

            toast.className = `${colorClass} text-white px-4 py-3 rounded shadow-lg flex items-center gap-2 transform translate-y-full opacity-0 transition-all duration-300 text-sm font-medium z-[100]`;
            toast.innerHTML = `<i class="ph ${iconClass} text-lg"></i> ${msg}`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-full', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };
    </script>

            { id: 35, name: "Lychee", price: 35.00, category: "Fruit Soda", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=200&q=80" },
            { id: 36, name: "Blueberry", price: 35.00, category: "Fruit Soda", image: "https://images.unsplash.com/photo-1597403491447-3ab08f8e44dc?auto=format&fit=crop&w=200&q=80" },
            { id: 37, name: "Green Apple", price: 35.00, category: "Fruit Soda", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=200&q=80" },
            { id: 38, name: "Orange", price: 35.00, category: "Fruit Soda", image: "https://images.unsplash.com/photo-1600271886742-f049cd451b08?auto=format&fit=crop&w=200&q=80" },
            { id: 39, name: "Coke Float", price: 39.00, category: "Soda Float", image: "https://images.unsplash.com/photo-1628873041695-095562095ce9?auto=format&fit=crop&w=200&q=80" },
            { id: 40, name: "Strawberry Float", price: 39.00, category: "Soda Float", image: "https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=200&q=80" },
            { id: 41, name: "Blueberry Float", price: 39.00, category: "Soda Float", image: "https://images.unsplash.com/photo-1597403491447-3ab08f8e44dc?auto=format&fit=crop&w=200&q=80" }
        ];

        const products = rawMenu;
        const categories = ["All", "Rice Meals", "A La Carte", "Hot Drinks", "Iced Coffee", "Iced Americano", "Non-Coffee", "Fruit Soda", "Soda Float"];

        const addOnsData = {
            coffee: [
                { id: 'c1', name: 'Extra Espresso', price: 15 },
                { id: 'c2', name: 'Fresh Milk', price: 10 },
                { id: 'c3', name: 'Condensed Milk', price: 10 },
                { id: 'c4', name: 'Honey', price: 10 },
                { id: 'c5', name: 'Lemon Juice', price: 10 },
                { id: 'c6', name: 'Whipped Cream', price: 10 },
                { id: 'c7', name: 'Caramel Syrup', price: 10 },
                { id: 'c8', name: 'Vanilla Syrup', price: 10 },
                { id: 'c9', name: 'Hazelnut Syrup', price: 10 }
            ],
            nonCoffee: [
                { id: 'nc1', name: 'Chocolate Syrup', price: 10 },
                { id: 'nc2', name: 'Strawberry Puree', price: 15 },
                { id: 'nc3', name: 'Matcha Powder', price: 15 },
                { id: 'nc4', name: 'Vanilla Ice Cream', price: 20 },
                { id: 'nc5', name: 'Coffee Jelly', price: 10 },
                { id: 'nc6', name: 'Pearl / Boba', price: 10 },
                { id: 'nc7', name: 'Cream Cheese Foam', price: 15 },
                { id: 'nc8', name: 'Extra Choco Drizzle', price: 10 }
            ],
            fruitSoda: [
                { id: 'fs1', name: 'Strawberry Syrup', price: 10 },
                { id: 'fs2', name: 'Four Seasons Syrup', price: 10 },
                { id: 'fs3', name: 'Blueberry Syrup', price: 10 },
                { id: 'fs4', name: 'Lychee Syrup', price: 10 },
                { id: 'fs5', name: 'Green Apple Syrup', price: 10 },
                { id: 'fs6', name: 'Orange Syrup', price: 10 },
                { id: 'fs7', name: 'Lemon Slices', price: 10 },
                { id: 'fs8', name: 'Popping Boba', price: 15 }
            ],
            food: [
                { id: 'f1', name: 'Extra Rice', price: 15 },
                { id: 'f2', name: 'Fried Egg', price: 15 },
                { id: 'f3', name: 'Extra Gravy', price: 10 },
                { id: 'f4', name: 'Cheese Sauce', price: 15 },
                { id: 'f5', name: 'Extra Siomai', price: 20 },
                { id: 'f6', name: 'Extra Lumpia', price: 10 },
                { id: 'f7', name: 'Extra Hotdog', price: 15 },
                { id: 'f8', name: 'Extra Adobo Top', price: 20 },
                { id: 'f9', name: 'Extra Sisig Top', price: 20 },
                { id: 'f10', name: 'Chili Garlic', price: 10 }
            ]
        };

        let ticket = [];
        let activeCategory = "All";
        let modalProduct = null;
        let modalAddons = [];
        let orderTotal = 0;
        
        // This will be populated by Firebase
        window.unavailableIds = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderProducts();
            startClock();
        });

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }, 1000);
        }

        function getAddonsForCategory(cat) {
            if (["Hot Drinks", "Iced Coffee", "Iced Americano"].includes(cat)) return addOnsData.coffee;
            if (["Non-Coffee", "Soda Float"].includes(cat)) return addOnsData.nonCoffee;
            if (["Fruit Soda"].includes(cat)) return addOnsData.fruitSoda;
            if (["Rice Meals", "A La Carte"].includes(cat)) return addOnsData.food;
            return [];
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = '';
            categories.forEach(cat => {
                const isActive = cat === activeCategory;
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-lg font-bold text-sm whitespace-nowrap transition-colors border ${
                    isActive ? 'bg-coffee-700 text-white border-coffee-800' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                }`;
                btn.textContent = cat;
                btn.onclick = () => { activeCategory = cat; renderTabs(); renderProducts(); };
                container.appendChild(btn);
            });
        }

        // Global access so Firebase can trigger re-renders
        window.renderProducts = function() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtered = activeCategory === "All" ? products : products.filter(p => p.category === activeCategory);

            filtered.forEach(p => {
                const isUnavailable = window.unavailableIds.includes(p.id);
                
                let colorClass = 'bg-gray-100 text-gray-600';
                if(p.category.includes('Coffee') || p.category.includes('Hot')) colorClass = 'bg-coffee-100 text-coffee-800';
                else if(p.category.includes('Soda')) colorClass = 'bg-amber-100 text-amber-800';

                const el = document.createElement('div');
                el.className = `bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden transition-all select-none flex flex-col ${isUnavailable ? 'opacity-60 grayscale cursor-not-allowed' : 'hover:shadow-md hover:border-coffee-300 cursor-pointer active:scale-95'}`;
                
                if (!isUnavailable) {
                    el.onclick = () => openAddonModal(p.id);
                }
                
                el.innerHTML = `
                    <div class="h-28 bg-gray-100 relative">
                        <img src="${p.image}" class="w-full h-full object-cover pointer-events-none" loading="lazy">
                        <span class="absolute top-2 left-2 ${colorClass} text-[9px] font-bold uppercase px-2 py-0.5 rounded shadow-sm">${p.category}</span>
                        ${isUnavailable ? '<div class="absolute inset-0 bg-black/40 flex items-center justify-center z-10"><span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded">UNAVAILABLE</span></div>' : ''}
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <h3 class="font-bold text-gray-800 text-sm leading-tight mb-2 line-clamp-2">${p.name}</h3>
                        <span class="text-coffee-600 font-bold">₱${p.price.toFixed(2)}</span>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        function renderTicket() {
            const container = document.getElementById('ticket-items');
            const emptyMsg = document.getElementById('empty-ticket-msg');
            const subtotalEl = document.getElementById('ticket-subtotal');
            const totalEl = document.getElementById('ticket-total');
            const payBtn = document.getElementById('pay-btn');

            if (ticket.length === 0) {
                emptyMsg.classList.remove('hidden');
                Array.from(container.children).forEach(c => { if(c.id !== 'empty-ticket-msg') c.remove(); });
                subtotalEl.textContent = '₱0.00';
                totalEl.textContent = '₱0.00';
                orderTotal = 0;
                payBtn.disabled = true;
                return;
            }

            emptyMsg.classList.add('hidden');
            Array.from(container.children).forEach(c => { if(c.id !== 'empty-ticket-msg') c.remove(); });

            let subtotal = 0;

            ticket.forEach(item => {
                subtotal += (item.unitPrice * item.quantity);
                const el = document.createElement('div');
                el.className = 'bg-white border border-gray-100 p-3 rounded-lg shadow-sm flex flex-col gap-2 relative group';
                
                let addonsHtml = '';
                if(item.addons.length > 0) {
                    addonsHtml = `<div class="text-xs text-gray-500 font-medium">` + item.addons.map(a => `+ ${a.name}`).join('<br>') + `</div>`;
                }

                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="pr-6">
                            <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                            ${addonsHtml}
                        </div>
                        <span class="font-bold text-coffee-700 text-sm whitespace-nowrap">₱${(item.unitPrice * item.quantity).toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <div class="flex items-center bg-gray-100 rounded-md overflow-hidden border border-gray-200">
                            <button onclick="changeTicketQty('${item.ticketId}', -1)" class="w-8 h-7 flex items-center justify-center hover:bg-gray-200 text-gray-600 transition-colors"><i class="ph ph-minus font-bold"></i></button>
                            <span class="w-8 text-center text-xs font-bold text-gray-800">${item.quantity}</span>
                            <button onclick="changeTicketQty('${item.ticketId}', 1)" class="w-8 h-7 flex items-center justify-center hover:bg-gray-200 text-gray-600 transition-colors"><i class="ph ph-plus font-bold"></i></button>
                        </div>
                        <button onclick="removeTicketItem('${item.ticketId}')" class="text-gray-400 hover:text-red-500 transition-colors bg-white w-7 h-7 rounded flex items-center justify-center">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });

            orderTotal = subtotal; 
            subtotalEl.textContent = `₱${subtotal.toFixed(2)}`;
            totalEl.textContent = `₱${orderTotal.toFixed(2)}`;
            payBtn.disabled = false;
            container.scrollTop = container.scrollHeight;
        }

        // --- Ticket Logic ---
        function clearOrder() {
            if(ticket.length === 0) return;
            if(confirm('Are you sure you want to clear the entire order?')) {
                ticket = [];
                renderTicket();
            }
        }

        function changeTicketQty(tid, delta) {
            const item = ticket.find(i => i.ticketId === tid);
            if(!item) return;
            item.quantity += delta;
            if(item.quantity <= 0) removeTicketItem(tid);
            else renderTicket();
        }

        function removeTicketItem(tid) {
            ticket = ticket.filter(i => i.ticketId !== tid);
            renderTicket();
        }

        // --- Add-on Modal Logic ---
        function openAddonModal(pid) {
            modalProduct = products.find(p => p.id === pid);
            if(!modalProduct) return;
            
            const availableAddons = getAddonsForCategory(modalProduct.category);
            modalAddons = [];
            
            if(availableAddons.length === 0) {
                confirmAddProduct();
                return;
            }

            document.getElementById('addon-product-name').textContent = modalProduct.name;
            document.getElementById('addon-product-price').textContent = `Base Price: ₱${modalProduct.price.toFixed(2)}`;
            updateAddonModalTotal();

            const list = document.getElementById('addon-list');
            list.innerHTML = '';
            
            availableAddons.forEach(a => {
                list.innerHTML += `
                    <label class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer select-none transition-colors">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" class="w-5 h-5 text-coffee-600 rounded border-gray-300 focus:ring-coffee-500" 
                                   onchange="toggleModalAddon('${a.id}', '${a.name}', ${a.price}, this.checked)">
                            <span class="text-sm font-bold text-gray-700">${a.name}</span>
                        </div>
                        <span class="text-sm font-bold text-coffee-600">+₱${a.price.toFixed(2)}</span>
                    </label>
                `;
            });

            document.getElementById('addon-modal').classList.remove('hidden');
        }

        function closeAddonModal() {
            document.getElementById('addon-modal').classList.add('hidden');
        }

        function toggleModalAddon(id, name, price, checked) {
            if(checked) modalAddons.push({id, name, price});
            else modalAddons = modalAddons.filter(a => a.id !== id);
            updateAddonModalTotal();
        }

        function updateAddonModalTotal() {
            if(!modalProduct) return;
            const extra = modalAddons.reduce((sum, a) => sum + a.price, 0);
            document.getElementById('addon-total-price').textContent = `₱${(modalProduct.price + extra).toFixed(2)}`;
        }

        function confirmAddProduct() {
            if(!modalProduct) return;
            
            const addonIdString = modalAddons.map(a => a.id).sort().join('-');
            const ticketId = `${modalProduct.id}-${addonIdString}`;
            const extrasTotal = modalAddons.reduce((sum, a) => sum + a.price, 0);
            const unitPrice = modalProduct.price + extrasTotal;

            const existing = ticket.find(t => t.ticketId === ticketId);
            if(existing) {
                existing.quantity += 1;
            } else {
                ticket.push({
                    ticketId,
                    ...modalProduct,
                    addons: [...modalAddons],
                    unitPrice,
                    quantity: 1
                });
            }

            renderTicket();
            closeAddonModal();
        }

        // --- Payment Logic ---
        function openPaymentModal() {
            if(ticket.length === 0) return;
            
            const summary = document.getElementById('payment-summary-items');
            summary.innerHTML = '';
            ticket.forEach(item => {
                summary.innerHTML += `
                    <div class="flex justify-between border-b border-gray-100 pb-2">
                        <div>
                            <span class="font-bold text-gray-800">${item.quantity}x</span> ${item.name}
                        </div>
                        <span class="font-bold">₱${(item.unitPrice * item.quantity).toFixed(2)}</span>
                    </div>
                `;
            });

            document.getElementById('payment-total-due').textContent = `₱${orderTotal.toFixed(2)}`;
            document.getElementById('cash-input').value = '';
            document.getElementById('change-due').textContent = '₱0.00';
            document.getElementById('change-due').classList.remove('text-green-500', 'text-red-500');
            document.getElementById('change-due').classList.add('text-gray-300');
            
            const badge = document.getElementById('payment-status-badge');
            badge.textContent = 'Waiting for cash...';
            badge.className = 'px-4 py-2 rounded-full font-bold text-sm bg-gray-200 text-gray-500 mb-auto';
            
            document.getElementById('complete-order-btn').disabled = true;

            document.getElementById('payment-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('cash-input').focus(), 100);
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function setCashExact() {
            document.getElementById('cash-input').value = orderTotal;
            calculateChange();
        }

        function setCash(amount) {
            const input = document.getElementById('cash-input');
            input.value = amount;
            calculateChange();
        }

        function calculateChange() {
            const tendered = parseFloat(document.getElementById('cash-input').value) || 0;
            const changeEl = document.getElementById('change-due');
            const badge = document.getElementById('payment-status-badge');
            const btn = document.getElementById('complete-order-btn');

            if (tendered >= orderTotal) {
                const change = tendered - orderTotal;
                changeEl.textContent = `₱${change.toFixed(2)}`;
                changeEl.classList.remove('text-gray-300', 'text-red-500');
                changeEl.classList.add('text-green-500');
                
                badge.textContent = 'Sufficient Funds';
                badge.className = 'px-4 py-2 rounded-full font-bold text-sm bg-green-100 text-green-700 mb-auto';
                btn.disabled = false;
            } else {
                changeEl.textContent = `₱0.00`;
                changeEl.classList.remove('text-green-500');
                if(tendered > 0) {
                    changeEl.classList.add('text-red-500');
                    badge.textContent = `Need ₱${(orderTotal - tendered).toFixed(2)} more`;
                    badge.className = 'px-4 py-2 rounded-full font-bold text-sm bg-red-100 text-red-700 mb-auto';
                } else {
                    changeEl.classList.add('text-gray-300');
                    badge.textContent = 'Waiting for cash...';
                    badge.className = 'px-4 py-2 rounded-full font-bold text-sm bg-gray-200 text-gray-500 mb-auto';
                }
                btn.disabled = true;
            }
        }

        async function completeOrder() {
            const tendered = parseFloat(document.getElementById('cash-input').value) || 0;
            if (tendered < orderTotal) return;

            const change = tendered - orderTotal;
            
            const btn = document.getElementById('complete-order-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Processing...';
            btn.disabled = true;

            // Save POS transaction to cloud
            const success = await window.submitPosOrderToFirebase(orderTotal, ticket);
            
            // Re-enable button
            btn.innerHTML = originalHtml;
            btn.disabled = false;

            if (success) {
                closePaymentModal();
                ticket = [];
                renderTicket();
                if (window.showToast) window.showToast(`Order Complete! Change: ₱${change.toFixed(2)}`, "success");
            }
        }
    </script>
</body>
</html>
