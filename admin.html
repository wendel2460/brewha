        function setupRealtimeListeners() {
            if(!user) return;
            
            const invRef = collection(db, 'artifacts', firestoreAppId, 'public', 'data', 'inventory');
            onSnapshot(invRef, (snapshot) => {
                if (snapshot.empty && inventoryData.length === 0) {
                    defaultInventoryData.forEach(item => setDoc(doc(invRef, item.id), item));
                } else {
                    inventoryData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (currentTab === 'inventory' || currentTab === 'dashboard') switchTab(currentTab);
                    checkInventoryLevels(false);
                }
            }, (error) => console.error("Error with Inventory listener", error));

            const ordersRef = collection(db, 'artifacts', firestoreAppId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                const allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allOrders.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)); 
                
                liveOrders = allOrders.filter(o => o.status !== 'Completed');
                completedOrders = allOrders.filter(o => o.status === 'Completed');
                
                const todayStr = new Date().toLocaleDateString();
                stats.revenueToday = completedOrders
                    .filter(o => new Date(o.completedAt || o.createdAt).toLocaleDateString() === todayStr)
                    .reduce((sum, order) => sum + order.total, 0);

                if (currentTab === 'orders' || currentTab === 'history' || currentTab === 'dashboard') switchTab(currentTab);
                updateBadges();
            }, (error) => console.error("Error with Orders listener", error));

            const availRef = doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'settings', 'availability');
            onSnapshot(availRef, (docSnap) => {
                if (docSnap.exists()) {
                    unavailableIds = docSnap.data().ids || [];
                } else {
                    unavailableIds = [];
                }
                if (currentTab === 'products' || currentTab === 'dashboard') switchTab(currentTab);
            });
        }

        // --- Recipe Parsing for Auto-Deductions ---
        function parseOrderItem(itemStr) {
            // Regex to pull quantity, base product, and any add-ons inside parentheses
            const match = itemStr.match(/^(\d+)x\s+(.*?)(?:\s+\(\+\s+(.*?)\))?$/);
            if (match) {
                return {
                    qty: parseInt(match[1], 10),
                    name: match[2].trim(),
                    addons: match[3] ? match[3].split(',').map(a => a.trim()) : []
                };
            }
            return null;
        }

        function getDeductions(name) {
            const recipeMap = {
                "Sisig": [{item: "Rice", amount: 0.2}, {item: "Pork", amount: 0.15}, {item: "Round Paper Bowls", amount: 1}],
                "Hungarian": [{item: "Rice", amount: 0.2}, {item: "Round Paper Bowls", amount: 1}],
                "Pork Katsu": [{item: "Rice", amount: 0.2}, {item: "Pork", amount: 0.15}, {item: "Round Paper Bowls", amount: 1}],
                "Chicken Adobo": [{item: "Rice", amount: 0.2}, {item: "Round Paper Bowls", amount: 1}],
                "Chicken Pastil": [{item: "Rice", amount: 0.2}, {item: "Round Paper Bowls", amount: 1}],
                "Lumpia Shanghai (3 pcs)": [{item: "Rice", amount: 0.2}, {item: "Lumpia", amount: 3}, {item: "Round Paper Bowls", amount: 1}],
                "Hotdog (2 pcs)": [{item: "Rice", amount: 0.2}, {item: "Round Paper Bowls", amount: 1}],
                "Siomai (4 pcs) Meal": [{item: "Rice", amount: 0.2}, {item: "Siomai", amount: 4}, {item: "Round Paper Bowls", amount: 1}],
                "Siomai (4 pcs)": [{item: "Siomai", amount: 4}, {item: "Round Paper Bowls", amount: 1}],
                "Lumpia Shanghai": [{item: "Lumpia", amount: 3}, {item: "Round Paper Bowls", amount: 1}],
                "Adobo": [{item: "Round Paper Bowls", amount: 1}],
                "Dinuguan": [{item: "Round Paper Bowls", amount: 1}],
                "Rice": [{item: "Rice", amount: 0.2}],
                
                "Brewed Coffee": [{item: "Coffee Beans", amount: 0.015}, {item: "Hot Cups", amount: 1}],
                "Café Latte": [{item: "Coffee Beans", amount: 0.015}, {item: "Fresh Milk", amount: 0.05}, {item: "Hot Cups", amount: 1}],
                "Hot Chocolate": [{item: "Chocolate Syrup", amount: 0.03}, {item: "Hot Cups", amount: 1}],
                
                "Vietnamese Coffee": [{item: "Coffee Beans", amount: 0.015}, {item: "Condensed Milk", amount: 0.05}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                "Latte": [{item: "Coffee Beans", amount: 0.015}, {item: "Fresh Milk", amount: 0.05}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                "Greek Frappe": [{item: "Coffee Beans", amount: 0.015}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                "Café Mocha": [{item: "Coffee Beans", amount: 0.015}, {item: "Chocolate Syrup", amount: 0.03}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                
                "Matcha Dalgona": [{item: "Matcha Powder", amount: 15}, {item: "Fresh Milk", amount: 0.05}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                "Coke Float": [{item: "Coke", amount: 1}, {item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],
                "Strawberry": [{item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1}],

                // Addons 
                "Extra Espresso / Strong Shot": [{item: "Coffee Beans", amount: 0.015}],
                "Extra Espresso": [{item: "Coffee Beans", amount: 0.015}],
                "Fresh Milk": [{item: "Fresh Milk", amount: 0.03}],
                "Condensed Milk": [{item: "Condensed Milk", amount: 0.03}],
                "Lemon Extract Juice": [{item: "Lemon Extract Juice", amount: 15}],
                "Lemon Juice": [{item: "Lemon Extract Juice", amount: 15}],
                "Chocolate Syrup": [{item: "Chocolate Syrup", amount: 0.015}],
                "Matcha Powder": [{item: "Matcha Powder", amount: 10}],
                "Extra Rice": [{item: "Rice", amount: 0.2}],
                "Extra Siomai": [{item: "Siomai", amount: 2}],
                "Extra Lumpia": [{item: "Lumpia", amount: 2}],
                "Extra Lumpia Shanghai": [{item: "Lumpia", amount: 2}]
            };

            if (recipeMap[name]) return recipeMap[name];
            
            // Generic Fallbacks for Unmapped Items
            let genericDeductions = [];
            if (name.toLowerCase().includes("coffee") || name.toLowerCase().includes("americano") || name.toLowerCase().includes("latte")) {
                genericDeductions.push({item: "Coffee Beans", amount: 0.015});
            }
            if (name.toLowerCase().includes("iced") || name.toLowerCase().includes("float") || name.toLowerCase().includes("soda")) {
                genericDeductions.push({item: "Ice", amount: 0.07}, {item: "Cold Cups", amount: 1});
            }
            if (name.toLowerCase().includes("hot")) {
                genericDeductions.push({item: "Hot Cups", amount: 1});
            }
            return genericDeductions;
        }

        // --- Cloud Actions ---
        window.switchTab = switchTab;
        
        window.updateOrderStatus = async function(id, newStatus) {
            if (!user) return;
            const orderDoc = doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'orders', id);
            await updateDoc(orderDoc, { status: newStatus });
        };
        
        window.markOrderDone = async function(id) {
            if (!user) return;
            const orderDoc = doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'orders', id);
            
            const order = liveOrders.find(o => o.id === id);
            
            // Deduct Ingredients upon completion! Prevents duplicate deduction if clicked twice quickly.
            if (order && !order.inventoryDeducted) {
                for (const itemStr of order.items) {
                    const parsed = parseOrderItem(itemStr);
                    if (parsed) {
                        const { qty, name, addons } = parsed;
                        
                        // Deduct Base Product
                        const prodDeductions = getDeductions(name);
                        for (const d of prodDeductions) await deductInventory(d.item, d.amount * qty);

                        // Deduct Added Extras
                        for (const addon of addons) {
                            const addonDeductions = getDeductions(addon);
                            for (const d of addonDeductions) await deductInventory(d.item, d.amount * qty);
                        }
                    }
                }
                await updateDoc(orderDoc, { status: 'Completed', completedAt: Date.now(), inventoryDeducted: true });
                showToast('Order Completed & Inventory Deducted!', 'success');
            } else {
                await updateDoc(orderDoc, { status: 'Completed', completedAt: Date.now() });
                showToast('Order marked as Completed!', 'success');
            }
        };

        window.toggleProductAvailability = async function(id) {
            if (!user) return;
            let newIds = [...unavailableIds];
            if (newIds.includes(id)) {
                newIds = newIds.filter(i => i !== id);
            } else {
                newIds.push(id);
            }
            await setDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'settings', 'availability'), { ids: newIds });
            showToast(newIds.includes(id) ? 'Marked as Unavailable' : 'Marked as Available', 'success');
        };
        
        window.simulateOnlineOrder = async function() {
            if (!user) { showToast("Not connected to database.", "warning"); return; }
            
            const newId = 'ORD-' + Math.floor(Math.random() * 9000 + 1000);
            const newOrder = {
                source: 'Online', customer: 'Simulation Guest', 
                items: ['1x Vietnamese Coffee', '2x Lumpia Shanghai (+ Extra Lumpia)'], 
                total: 79.00, status: 'Pending', time: 'Just now',
                createdAt: Date.now()
            };

            await setDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'orders', newId), newOrder);
            showToast(`Simulated Order received: ${newId}`, 'info');
        };
        
        window.restockItem = async function(id) {
            if (!user) return;
            const item = inventoryData.find(i => i.id === id);
            if(item) {
                const newStock = item.stock + (item.threshold * 5);
                await updateDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'inventory', item.id), { stock: newStock });
                showToast(`Restocked ${item.item}. New level: ${newStock} ${item.unit}`, 'success');
            }
        };

        async function deductInventory(itemName, amount) {
            const item = inventoryData.find(i => i.item === itemName);
            if(item) {
                const newStock = Math.max(0, parseFloat((item.stock - amount).toFixed(3)));
                await updateDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'inventory', item.id), { stock: newStock });
                if (newStock <= item.threshold && item.stock > item.threshold) {
                    showToast(`Alert: ${item.item} is running low! (${newStock} ${item.unit} left)`, 'warning');
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('#nav-links button').forEach(btn => {
                btn.classList.remove('bg-coffee-800', 'text-white');
                btn.classList.add('text-coffee-200');
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-coffee-200');
                activeBtn.classList.add('bg-coffee-800', 'text-white');
            }

            const viewContainer = document.getElementById('main-view');
            viewContainer.innerHTML = '';

            if(tab === 'dashboard') viewContainer.innerHTML = getDashboardHTML();
            else if(tab === 'orders') viewContainer.innerHTML = getOrdersHTML();
            else if(tab === 'history') viewContainer.innerHTML = getHistoryHTML();
            else if(tab === 'inventory') viewContainer.innerHTML = getInventoryHTML();
            else if(tab === 'products') viewContainer.innerHTML = getProductsHTML();

            updateBadges();
        }

        // --- View Generators ---
        function getDashboardHTML() {
            const lowStockItems = inventoryData.filter(i => i.stock <= i.threshold);
            
            let alertsHtml = lowStockItems.length === 0 
                ? `<div class="text-gray-500 text-sm py-4 text-center">All inventory levels are good!</div>`
                : lowStockItems.map(i => `
                    <div class="flex justify-between items-center p-3 bg-red-50 rounded-lg border border-red-100 mb-2">
                        <div class="flex items-center gap-3">
                            <i class="ph ph-warning-circle text-red-500 text-xl"></i>
                            <div>
                                <p class="text-sm font-bold text-gray-800">${i.item}</p>
                                <p class="text-xs text-red-600">Only ${i.stock} ${i.unit} left (Threshold: ${i.threshold})</p>
                            </div>
                        </div>
                        <button onclick="switchTab('inventory')" class="text-xs font-bold text-red-600 bg-white px-3 py-1 rounded border border-red-200 hover:bg-red-50">Review</button>
                    </div>
                `).join('');

            return `
                <div class="fade-in max-w-5xl mx-auto">
                    <h1 class="text-2xl font-bold text-gray-800 mb-6">Overview</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center gap-4 cursor-pointer hover:shadow-md transition-shadow" onclick="switchTab('history')">
                            <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="ph ph-currency-circle-dollar"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Today's Revenue</p>
                                <p class="text-2xl font-bold text-gray-800">₱${stats.revenueToday.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center gap-4 cursor-pointer hover:shadow-md transition-shadow" onclick="switchTab('orders')">
                            <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl"><i class="ph ph-receipt"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Active Orders</p>
                                <p class="text-2xl font-bold text-gray-800">${liveOrders.length}</p>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center gap-4 cursor-pointer hover:shadow-md transition-shadow" onclick="switchTab('inventory')">
                            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-2xl"><i class="ph ph-package"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Low Stock Alerts</p>
                                <p class="text-2xl font-bold text-red-600">${lowStockItems.length} Items</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 lg:col-span-2">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="font-bold text-lg text-gray-800">Inventory Alerts</h2>
                            </div>
                            <div class="space-y-1">
                                ${alertsHtml}
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                            <h2 class="font-bold text-lg text-gray-800 mb-4">Quick Actions</h2>
                            <div class="space-y-3">
                                <button onclick="simulateOnlineOrder()" class="w-full bg-coffee-50 border border-coffee-200 text-coffee-800 py-3 rounded-lg font-medium hover:bg-coffee-100 transition-colors flex items-center justify-center gap-2">
                                    <i class="ph ph-bell-ringing"></i> Simulate Incoming Order
                                </button>
                                <button onclick="switchTab('products')" class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-100 transition-colors flex items-center justify-center gap-2">
                                    <i class="ph ph-list-plus"></i> Manage Menu
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getOrdersHTML() {
            if(liveOrders.length === 0) {
                return `
                    <div class="fade-in max-w-5xl mx-auto h-full flex flex-col items-center justify-center text-gray-400 mt-20">
                        <i class="ph ph-check-circle text-6xl mb-4 opacity-50"></i>
                        <h2 class="text-xl font-bold text-gray-600">All caught up!</h2>
                        <p class="mb-6">No pending orders at the moment.</p>
                        <button onclick="simulateOnlineOrder()" class="bg-coffee-700 text-white px-6 py-2 rounded-lg font-medium hover:bg-coffee-800">Simulate Order</button>
                    </div>
                `;
            }

            const ordersHtml = liveOrders.map(order => `
                <div class="bg-white rounded-xl shadow-sm border ${order.status === 'Pending' ? 'border-amber-200' : 'border-blue-200'} p-5 flex flex-col md:flex-row justify-between gap-4 fade-in relative overflow-hidden">
                    ${order.status === 'Pending' ? '<div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>' : '<div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>'}
                    <div class="flex-1 pl-2">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="font-bold text-gray-800">${order.id}</span>
                            <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded font-bold">${order.source}</span>
                            <span class="text-xs text-gray-400"><i class="ph ph-clock"></i> ${new Date(order.createdAt).toLocaleTimeString()}</span>
                        </div>
                        <p class="text-sm font-bold text-gray-700 mb-2"><i class="ph ph-user"></i> ${order.customer}</p>
                        <ul class="text-sm text-gray-600 space-y-1 mb-3">
                            ${order.items.map(i => `<li>• ${i}</li>`).join('')}
                        </ul>
                        <p class="font-bold text-coffee-700">Total: ₱${order.total.toFixed(2)}</p>
                    </div>
                    <div class="flex flex-col gap-2 justify-center min-w-[140px]">
                        ${order.status === 'Pending' 
                            ? `<button onclick="updateOrderStatus('${order.id}', 'Preparing')" class="bg-blue-50 text-blue-700 border border-blue-200 py-2 px-4 rounded-lg font-bold text-sm hover:bg-blue-100 transition-colors w-full">Mark Preparing</button>`
                            : `<button disabled class="bg-gray-100 text-gray-400 border border-gray-200 py-2 px-4 rounded-lg font-bold text-sm w-full">Preparing...</button>`
                        }
                        <button onclick="markOrderDone('${order.id}')" class="bg-green-600 text-white py-2 px-4 rounded-lg font-bold text-sm hover:bg-green-700 transition-colors shadow-sm w-full flex items-center justify-center gap-1">
                            <i class="ph ph-check"></i> Complete
                        </button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="fade-in max-w-4xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold text-gray-800">Live Orders (Cloud Synced)</h1>
                        <button onclick="simulateOnlineOrder()" class="text-sm font-medium text-coffee-600 hover:text-coffee-800 flex items-center gap-1"><i class="ph ph-plus-circle"></i> Test Order</button>
                    </div>
                    <div class="space-y-4">
                        ${ordersHtml}
                    </div>
                </div>
            `;
        }

        function groupOrdersByDate(orders) {
            const grouped = {};
            orders.forEach(order => {
                const date = new Date(order.completedAt || order.createdAt).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                if (!grouped[date]) {
                    grouped[date] = { orders: [], dailyRevenue: 0 };
                }
                grouped[date].orders.push(order);
                grouped[date].dailyRevenue += order.total;
            });
            return grouped;
        }

        function getHistoryHTML() {
            if(completedOrders.length === 0) {
                return `
                    <div class="fade-in max-w-5xl mx-auto h-full flex flex-col items-center justify-center text-gray-400 mt-20">
                        <i class="ph ph-clock-counter-clockwise text-6xl mb-4 opacity-50"></i>
                        <h2 class="text-xl font-bold text-gray-600">No History Yet!</h2>
                        <p class="mb-6">Completed orders will appear here automatically.</p>
                    </div>
                `;
            }

            const groupedOrders = groupOrdersByDate(completedOrders);
            let historyHtml = '';

            for (const [date, data] of Object.entries(groupedOrders)) {
                historyHtml += `
                    <div class="mb-8 fade-in">
                        <div class="flex justify-between items-end mb-4 border-b border-gray-200 pb-2">
                            <h3 class="text-lg font-bold text-gray-800">${date}</h3>
                            <span class="text-sm font-bold text-coffee-600 bg-coffee-50 px-3 py-1 rounded-full border border-coffee-200 shadow-sm">Daily Revenue: ₱${data.dailyRevenue.toFixed(2)}</span>
                        </div>
                        <div class="space-y-3">
                `;
                
                data.orders.forEach(order => {
                    historyHtml += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col md:flex-row justify-between gap-4 relative overflow-hidden opacity-80 hover:opacity-100 transition-opacity">
                            <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                            <div class="flex-1 pl-2">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="font-bold text-gray-800">${order.id}</span>
                                    <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded font-bold">${order.source}</span>
                                    <span class="text-xs text-gray-500"><i class="ph ph-check-circle text-green-500"></i> Completed ${new Date(order.completedAt || order.createdAt).toLocaleTimeString()}</span>
                                </div>
                                <p class="text-sm font-bold text-gray-700 mb-2"><i class="ph ph-user"></i> ${order.customer}</p>
                                <ul class="text-sm text-gray-500 space-y-1 mb-3">
                                    ${order.items.map(i => `<li>• ${i}</li>`).join('')}
                                </ul>
                                <p class="font-bold text-coffee-700">Paid: ₱${order.total.toFixed(2)}</p>
                            </div>
                        </div>
                    `;
                });
                historyHtml += `</div></div>`;
            }

            return `
                <div class="fade-in max-w-4xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold text-gray-800">Order History</h1>
                    </div>
                    ${historyHtml}
                </div>
            `;
        }

        function getInventoryHTML() {
            let tableRows = inventoryData.map(item => {
                const isLow = item.stock <= item.threshold;
                const statusBadge = isLow 
                    ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Low Stock</span>`
                    : `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Good</span>`;
                
                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="p-4 text-sm font-bold text-gray-800">${item.item}</td>
                        <td class="p-4 text-sm text-gray-500">${item.category}</td>
                        <td class="p-4 text-sm font-bold ${isLow ? 'text-red-600' : 'text-gray-700'}">${item.stock} ${item.unit}</td>
                        <td class="p-4 text-sm text-gray-500">${item.threshold} ${item.unit}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right">
                            <button onclick="restockItem('${item.id}')" class="text-coffee-600 hover:bg-coffee-50 p-2 rounded transition-colors text-sm font-medium border border-transparent hover:border-coffee-200">Restock</button>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="fade-in max-w-6xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold text-gray-800">Ingredient Inventory (Cloud Synced)</h1>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-200">
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Item</th>
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Category</th>
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Current Stock</th>
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Restock Alert At</th>
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Status</th>
                                        <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function getProductsHTML() {
            let tableRows = productsList.map(item => {
                const isAvail = !unavailableIds.includes(item.id);
                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="p-4 text-sm font-bold text-gray-800">${item.name}</td>
                    <td class="p-4 text-sm text-gray-500"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">${item.category}</span></td>
                    <td class="p-4 text-sm font-bold text-coffee-700">₱${item.price.toFixed(2)}</td>
                    <td class="p-4 text-sm font-bold flex items-center gap-1 ${isAvail ? 'text-green-600' : 'text-red-500'}">
                        ${isAvail ? '<i class="ph ph-check-circle"></i> Available' : '<i class="ph ph-x-circle"></i> Unavailable'}
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="toggleProductAvailability(${item.id})" class="text-xs px-3 py-1.5 rounded border font-bold transition-colors ${isAvail ? 'border-red-200 text-red-600 hover:bg-red-50' : 'border-green-200 text-green-600 hover:bg-green-50'}">
                            Mark ${isAvail ? 'Unavailable' : 'Available'}
                        </button>
                    </td>
                </tr>
            `}).join('');

            return `
                <div class="fade-in max-w-5xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold text-gray-800">Product Catalog</h1>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200">
                                    <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Product Name</th>
                                    <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Category</th>
                                    <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">Price</th>
                                    <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider">POS/Menu Status</th>
                                    <th class="p-4 font-bold text-gray-600 text-sm uppercase tracking-wider text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function updateBadges() {
            const orderBadge = document.getElementById('nav-order-count');
            if(liveOrders.length > 0) {
                orderBadge.textContent = liveOrders.length;
                orderBadge.classList.remove('hidden');
            } else {
                orderBadge.classList.add('hidden');
            }

            const alertBadge = document.getElementById('nav-alert-count');
            const lowStockCount = inventoryData.filter(i => i.stock <= i.threshold).length;
            if(lowStockCount > 0) {
                alertBadge.textContent = lowStockCount;
                alertBadge.classList.remove('hidden');
            } else {
                alertBadge.classList.add('hidden');
            }
        }

        function checkInventoryLevels(showToasts = false) {
            inventoryData.forEach(item => {
                if (item.stock <= item.threshold && item.stock > (item.threshold - 2) && showToasts) {
                    showToast(`Alert: ${item.item} is running low! (${item.stock} ${item.unit} left)`, 'warning');
                }
            });
            updateBadges();
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClasses = 'bg-gray-800 text-white';
            let icon = 'ph-info';
            
            if(type === 'success') { colorClasses = 'bg-green-600 text-white'; icon = 'ph-check-circle'; }
            if(type === 'warning') { colorClasses = 'bg-red-500 text-white'; icon = 'ph-warning-circle'; }

            toast.className = `${colorClasses} px-5 py-3 rounded-lg shadow-xl flex items-center gap-3 transform translate-y-full opacity-0 transition-all duration-300 text-sm font-medium z-[100]`;
            toast.innerHTML = `<i class="ph ${icon} text-xl"></i> ${msg}`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-full', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('dashboard');
        });
    </script>
</body>
</html>
