<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewha | Login & Order Online</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        coffee: {
                            50: '#fdf8f4', 100: '#f8efe6', 200: '#eedbc6',
                            300: '#e1c0a0', 400: '#d19e72', 500: '#c5814e',
                            600: '#b86a3d', 700: '#9a5334', 800: '#7e452e',
                            900: '#663928', 950: '#361c12',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .bg-pattern {
            background-image: linear-gradient(rgba(54, 28, 18, 0.8), rgba(54, 28, 18, 0.9)), url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .form-panel { transition: all 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 font-sans text-gray-800 antialiased selection:bg-coffee-300">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden opacity-0 animate-slide-up relative">
        
        <!-- Header -->
        <div class="bg-coffee-50 p-8 text-center border-b border-coffee-100">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-coffee-900 text-white mb-4 shadow-lg">
                <i class="ph ph-coffee-bean text-3xl"></i>
            </div>
            <h1 class="text-3xl font-serif font-bold text-coffee-950">Brewha</h1>
            <p class="text-coffee-600 mt-2 text-sm font-medium uppercase tracking-widest">Login Portal</p>
        </div>

        <!-- Tab Toggle -->
        <div class="flex border-b border-gray-100 bg-white">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-4 text-sm font-bold border-b-2 border-coffee-600 text-coffee-900 transition-colors focus:outline-none">Sign In</button>
            <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 py-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-coffee-600 transition-colors focus:outline-none">Sign Up (Student)</button>
        </div>

        <div class="relative overflow-hidden h-[420px]" id="form-container">
            
            <!-- LOGIN FORM -->
            <form id="login-form" class="absolute w-full h-full p-8 flex flex-col form-panel transform translate-x-0">
                <div class="space-y-5 flex-1">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Student ID / Username</label>
                        <div class="relative">
                            <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="text" id="login-id" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 focus:border-coffee-500 transition-all" placeholder="Enter ID or Username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                        <div class="relative">
                            <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="password" id="login-pass" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 focus:border-coffee-500 transition-all" placeholder="••••••••">
                        </div>
                    </div>
                </div>
                
                <button type="submit" id="btn-login" class="w-full bg-coffee-900 text-white py-3.5 rounded-xl font-bold hover:bg-coffee-800 transition-colors shadow-md flex items-center justify-center gap-2 mt-6">
                    <span>Log In</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signup-form" class="absolute w-full h-full p-8 flex flex-col form-panel transform translate-x-full">
                <div class="space-y-4 flex-1 overflow-y-auto no-scrollbar pb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Student ID</label>
                        <input type="text" id="reg-id" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 transition-all" placeholder="e.g. 2024-00123">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Full Name</label>
                        <input type="text" id="reg-name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 transition-all" placeholder="Juan Dela Cruz">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Contact Number</label>
                        <input type="tel" id="reg-phone" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 transition-all" placeholder="09XX-XXX-XXXX">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Password</label>
                        <input type="password" id="reg-pass" required minlength="6" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 transition-all" placeholder="Min. 6 characters">
                    </div>
                </div>
                
                <button type="submit" id="btn-signup" class="w-full bg-coffee-600 text-white py-3.5 rounded-xl font-bold hover:bg-coffee-500 transition-colors shadow-md flex items-center justify-center gap-2 mt-4 flex-shrink-0">
                    <span>Create Account</span>
                    <i class="ph ph-user-plus"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your specific Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDsap0Yqqlr5ghuhXJuCbItWCQRNXKJMP8",
            authDomain: "brewha-cafe.firebaseapp.com",
            projectId: "brewha-cafe",
            storageBucket: "brewha-cafe.firebasestorage.app",
            messagingSenderId: "831922440831",
            appId: "1:831922440831:web:03c44a4598d00c6c0c4d4a",
            measurementId: "G-83SR0EB5EE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Functions
        window.switchTab = function(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.classList.replace('-translate-x-full', 'translate-x-0');
                signupForm.classList.replace('translate-x-0', 'translate-x-full');
                
                tabLogin.classList.replace('border-transparent', 'border-coffee-600');
                tabLogin.classList.replace('text-gray-400', 'text-coffee-900');
                
                tabSignup.classList.replace('border-coffee-600', 'border-transparent');
                tabSignup.classList.replace('text-coffee-900', 'text-gray-400');
            } else {
                loginForm.classList.replace('translate-x-0', '-translate-x-full');
                signupForm.classList.replace('translate-x-full', 'translate-x-0');
                
                tabSignup.classList.replace('border-transparent', 'border-coffee-600');
                tabSignup.classList.replace('text-gray-400', 'text-coffee-900');
                
                tabLogin.classList.replace('border-coffee-600', 'border-transparent');
                tabLogin.classList.replace('text-coffee-900', 'text-gray-400');
            }
        };

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = isError ? 'bg-red-500' : 'bg-gray-900';
            const icon = isError ? '<i class="ph ph-warning-circle"></i>' : '<i class="ph ph-check-circle text-green-400"></i>';

            toast.className = `${bgClass} text-white px-6 py-4 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-full opacity-0 transition-all duration-300 z-50 font-medium text-sm`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-full', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setButtonLoading(btnId, isLoading, originalText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<i class="ph ph-spinner animate-spin text-xl"></i> <span>Processing...</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // --- Auth Logic ---
        
        // 1. Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;

            // Dashboard Redirect Rules
            if (id.toLowerCase() === 'pos' && pass === 'pass123') {
                window.location.href = 'pos.html';
                return;
            }
            
            if (id.toLowerCase() === 'admin' && pass === 'pass123') {
                window.location.href = 'admin.html';
                return;
            }

            // Student/Customer Login
            const originalBtnHtml = `<span>Log In</span><i class="ph ph-arrow-right"></i>`;
            setButtonLoading('btn-login', true, originalBtnHtml);

            try {
                // Firebase Auth requires emails, so we map the Student ID to a virtual domain
                const virtualEmail = `${id}@brewha.edu`;
                await signInWithEmailAndPassword(auth, virtualEmail, pass);
                
                showToast("Login successful! Redirecting to menu...");
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                let msg = "Invalid Student ID or Password.";
                if (error.code === 'auth/user-not-found') msg = "Account not found. Please sign up.";
                showToast(msg, true);
                setButtonLoading('btn-login', false, originalBtnHtml);
            }
        });

        // 2. Handle Sign Up
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentId = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value;

            const originalBtnHtml = `<span>Create Account</span><i class="ph ph-user-plus"></i>`;
            setButtonLoading('btn-signup', true, originalBtnHtml);

            try {
                // Create auth user with virtual email based on student ID
                const virtualEmail = `${studentId}@brewha.edu`;
                const userCredential = await createUserWithEmailAndPassword(auth, virtualEmail, pass);
                const user = userCredential.user;

                // Save extended profile data to Firestore
                await setDoc(doc(db, 'users', user.uid), {
                    studentId: studentId,
                    fullName: name,
                    contactNumber: phone,
                    role: 'student',
                    createdAt: Date.now()
                });

                showToast("Account created! Redirecting to menu...");
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                let msg = "Error creating account. Please try again.";
                if (error.code === 'auth/email-already-in-use') msg = "This Student ID is already registered.";
                if (error.code === 'auth/weak-password') msg = "Password should be at least 6 characters.";
                
                showToast(msg, true);
                setButtonLoading('btn-signup', false, originalBtnHtml);
            }
        });
    </script>
</body>
</html>
